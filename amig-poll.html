<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIG Advanced Tips – Flash Focus Live Poll</title>
<style>
:root{--primary:#0B2545;--accent:#0F766E;--hl:#F2A541;--bg:#F4F6F9;--text:#1A1F2B;--muted:#4F5968;--border:#D5DBE5;--danger:#B42318;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.5}
header{background:var(--primary);color:#fff;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.logo{font-weight:700;font-size:1.5rem}
.badge{font-size:.85rem;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 12px;margin-left:16px}
nav a,nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:var(--r);padding:8px 16px;font:inherit;font-size:.95rem;cursor:pointer;text-decoration:none;margin-left:8px}
nav .on{background:#fff;color:var(--primary);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:32px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.pill{display:inline-block;background:var(--primary);color:#fff;border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600;margin-right:6px}
.pill.alt{background:var(--accent)}
.timer{font-size:2rem;font-weight:700;border:2px solid var(--primary);border-radius:var(--r);padding:4px 16px;color:var(--primary)}
.timer.warn{color:var(--danger);border-color:var(--danger)}
.ptitle{text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:24px 0 8px;font-size:1.1rem;font-weight:700}
.q{font-size:clamp(1.5rem,3vw,2.4rem);font-weight:700;line-height:1.25;margin:0 0 24px;color:var(--primary)}
.btn{font:inherit;font-size:1rem;font-weight:600;padding:12px 20px;border-radius:var(--r);border:2px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;margin:4px}
.btn.ghost{background:#fff;color:var(--primary)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
.btn:disabled,.opt:disabled{opacity:.45;cursor:not-allowed}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;font:inherit;font-size:1.3rem;padding:16px 24px;background:#fff;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;min-height:72px;color:var(--text)}
.opt.sel{border-color:var(--primary);background:#E8EEF7;box-shadow:inset 0 0 0 2px var(--primary)}
.letter{flex:0 0 44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.scale{display:flex;gap:16px;flex-wrap:wrap}
.scale .opt{flex:1;min-width:70px;justify-content:center;font-size:2rem;font-weight:700;color:var(--primary)}
.labels{display:flex;justify-content:space-between;color:var(--muted);margin-top:8px}
.mode{margin-bottom:16px}
.controls{border-top:1px solid var(--border);margin-top:24px;padding-top:16px}
.tally{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);padding:8px 0;font-size:1.2rem}
.tally .l{flex:1}
.tally .n{min-width:50px;text-align:center;font-size:1.6rem;font-weight:700}
.bar{display:grid;grid-template-columns:2fr 3fr 120px;gap:16px;align-items:center;margin-bottom:12px}
.track{height:30px;background:#E6EAF0;border-radius:var(--r);overflow:hidden}
.fill{height:100%;background:var(--primary)}
.bar.top .fill{background:var(--accent)}
.big{font-size:3rem;font-weight:800;color:var(--primary)}
.notes{background:#FFF8EB;border:1px solid var(--hl);border-radius:var(--r);padding:16px 24px;margin-top:24px}
.closed{background:#FEF3F2;border:1px solid var(--danger);color:var(--danger);padding:8px 16px;border-radius:var(--r);margin-bottom:16px;font-weight:600}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}
th{background:var(--primary);color:#fff}
#err{display:none;background:#fee;color:#900;padding:12px;margin:16px 32px;border-radius:8px;font-weight:600}
@media(max-width:700px){.bar{grid-template-columns:1fr}main{padding:16px}}
@media print{header,.controls,.mode,.noprint{display:none}}
</style>
</head>
<body>
<header>
  <div><span class="logo">Cotality</span><span class="badge">Flash Focus | Cotality Learning &amp; Development</span></div>
  <nav>
    <a href="index.html">⌂ All polls</a>
    <button id="tabPresent" onclick="showView('present')">Present</button>
    <button id="tabSummary" onclick="showView('summary')">Summary</button>
  </nav>
</header>
<div id="err"></div>
<main id="app">
  <div class="card">
    <h2>Loading AMIG polls…</h2>
    <p class="muted">If this message stays on screen, the page script did not load. Make sure the whole file was pasted, ending with &lt;/html&gt;.</p>
  </div>
</main>

<script>
window.onerror = function (msg, src, line) {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'Error: ' + msg + ' (line ' + line + ')';
};
</script>

<script>
var STORE = 'ffpoll_amig_lite';
var TYPE = { single: 'Single Choice', multi: 'Multi-Select', rating: 'Rating' };

/* ===== AMIG POLLS ===== */
var POLLS = [
  {
    title: "Diagramming – Build Out", type: "rating", timer: 20,
    q: "How confident are you using Build Out when creating a diagram?",
    options: ["1", "2", "3", "4", "5"], minLabel: "Not at all confident", maxLabel: "Very confident",
    notes: { purpose: "Measures confidence with Build Out.", listen: "Low scores or a wide spread across the room.", follow: "What part of Build Out would you like to see demonstrated?", act: "Adjust Build Out demo time based on the average score." }
  },
  {
    title: "Diagramming – Copy/Paste and Defaults", type: "multi", timer: 30,
    q: "Which of these Diagramming tools do you currently use? Select all that apply.",
    options: ["Copy/Paste rooms", "Copy/Paste wall elements", "Default doors/windows", "None of these yet"],
    notes: { purpose: "Shows use of Copy/Paste for rooms and wall elements, and Default doors/windows.", listen: "The least-selected tool.", follow: "Who uses Copy/Paste or Default doors/windows and can share how?", act: "Start the Diagramming demo with the least-selected tool." }
  },
  {
    title: "Line-Items", type: "multi", timer: 30,
    q: "Which of these Line-Item tools do you currently use? Select all that apply.",
    options: ["Copy/Paste rooms and items from old diagrams", "Assemblies/Batches", "Apply to Multiple Rooms", "None of these yet"],
    notes: { purpose: "Shows use of the three Line-Item tools covered today.", listen: "The least-selected tool.", follow: "Who has an Assembly or Batch they use often?", act: "Start the Line-Items demo with the least-selected tool." }
  },
  {
    title: "Estimate – Coverage and Depreciation", type: "single", timer: 20,
    q: "When coverage or depreciation needs to change on multiple line items, what do you use?",
    options: ["Search and Replace", "Editing Multiple Items", "I edit each item individually", "Not sure"],
    notes: { purpose: "Shows use of Search and Replace and Editing Multiple Items.", listen: "How many answer C or D.", follow: "Who uses Search and Replace for coverage or depreciation?", act: "Demo Search and Replace, then Editing Multiple Items." }
  },
  {
    title: "Estimate – Minimum Charges", type: "single", timer: 20,
    q: "Do you have Minimum Charges enabled?",
    options: ["Yes", "No", "Not sure how to enable", "Not sure if it is enabled"],
    notes: { purpose: "Shows who has Minimum Charges enabled.", listen: "How many answer C or D.", follow: "Who has Minimum Charges enabled today?", act: "Show where to enable Minimum Charges." }
  }
];

var S = { current: 0, mode: 'vote', data: [] };
var sel = [], view = 'present', notesOn = false, left = 0, tid = null, closed = false;

function blank() { return POLLS.map(function (p) { return { counts: p.options.map(function () { return 0; }), voters: 0, revealed: false }; }); }
function load() {
  try { var s = JSON.parse(localStorage.getItem(STORE)); if (s && s.data && s.data.length === POLLS.length) S = s; } catch (e) {}
  if (!S.data.length) S.data = blank();
  if (S.current >= POLLS.length) S.current = 0;
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function L(i) { return String.fromCharCode(65 + i); }
function fmt(s) { return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i]; return t; }
function P() { return POLLS[S.current]; }
function D() { return S.data[S.current]; }
function totalOf(p, d) { return p.type === 'multi' ? Math.max(d.voters, Math.max.apply(null, d.counts)) : sum(d.counts); }
function avgOf(d) { var t = sum(d.counts), a = 0; for (var i = 0; i < d.counts.length; i++) a += (i + 1) * d.counts[i]; return t ? a / t : 0; }
function optLabel(p, i) {
  if (p.type !== 'rating') return L(i) + ') ' + p.options[i];
  if (i === 0) return p.options[i] + ' – ' + p.minLabel;
  if (i === p.options.length - 1) return p.options[i] + ' – ' + p.maxLabel;
  return p.options[i];
}

/* ===== TIMER ===== */
function resetTimer() { clearInterval(tid); tid = null; closed = false; left = P().timer; }
function toggleTimer() {
  if (tid) { clearInterval(tid); tid = null; render(); return; }
  if (closed) return;
  if (left <= 0) left = P().timer;
  tid = setInterval(function () {
    left--;
    var t = document.getElementById('timer');
    if (t) { t.textContent = '⏱ ' + fmt(left); if (left <= 5) t.className = 'timer warn'; }
    if (left <= 0) { clearInterval(tid); tid = null; closed = true; D().revealed = true; save(); render(); }
  }, 1000);
  render();
}

/* ===== ACTIONS ===== */
function setMode(m) { S.mode = m; sel = []; save(); render(); }
function pick(i) {
  if (closed) return;
  if (P().type === 'multi') { var k = sel.indexOf(i); if (k >= 0) sel.splice(k, 1); else sel.push(i); }
  else sel = [i];
  render();
}
function submitVote() {
  if (closed) return;
  if (!sel.length) { var m = document.getElementById('msg'); if (m) m.textContent = 'Select an option first.'; return; }
  var d = D();
  sel.forEach(function (i) { d.counts[i]++; });
  d.voters++; sel = []; save(); render();
  var m2 = document.getElementById('msg'); if (m2) m2.textContent = '✔ Response recorded. Pass to the next person.';
}
function tally(i, dv) {
  if (closed) return;
  var d = D(), p = P();
  if (i === -1) d.voters = Math.max(0, d.voters + dv);
  else {
    d.counts[i] = Math.max(0, d.counts[i] + dv);
    d.voters = p.type === 'multi' ? Math.max(d.voters, Math.max.apply(null, d.counts)) : sum(d.counts);
  }
  save(); render();
}
function go(dir) {
  var i = S.current + dir;
  if (i < 0) return;
  if (i >= POLLS.length) { showView('summary'); return; }
  S.current = i; sel = []; resetTimer(); save(); render();
}
function toggleReveal() { D().revealed = !D().revealed; save(); render(); }
function reopen() { closed = false; left = P().timer; render(); }
function resetPoll() {
  if (!confirm('Clear all responses for this poll?')) return;
  S.data[S.current] = { counts: P().options.map(function () { return 0; }), voters: 0, revealed: false };
  sel = []; resetTimer(); save(); render();
}
function resetAll() {
  if (!confirm('Clear all votes for every poll?')) return;
  S.data = blank(); S.current = 0; sel = []; resetTimer(); save(); showView('present');
}

/* ===== RENDER ===== */
function tallyRow(lbl, i, n, dis) {
  return '<div class="tally"><span class="l">' + esc(lbl) + '</span>' +
    '<button class="btn ghost" onclick="tally(' + i + ',-1)"' + dis + '>−</button>' +
    '<span class="n">' + n + '</span>' +
    '<button class="btn" onclick="tally(' + i + ',1)"' + dis + '>+</button></div>';
}
function results(p, d) {
  var h = '<h3>📊 Results</h3>', total = totalOf(p, d);
  if (!total) return h + '<p class="muted">No responses yet.</p>';
  var max = Math.max.apply(null, d.counts);
  if (p.type === 'rating') h += '<p><span class="big">' + avgOf(d).toFixed(1) + '</span> <span class="muted">average out of 5 · ' + total + ' responses</span></p>';
  p.options.forEach(function (o, i) {
    var pct = Math.round(d.counts[i] / total * 100), top = d.counts[i] === max && max > 0;
    h += '<div class="bar' + (top ? ' top' : '') + '"><div>' + esc(optLabel(p, i)) + (top ? ' <strong>★ Top</strong>' : '') + '</div>' +
      '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div><strong>' + pct + '%</strong> (' + d.counts[i] + ')</div></div>';
  });
  if (p.type === 'multi') h += '<p class="muted">Multi-select: percentages can add up to more than 100%.</p>';
  return h;
}
function present() {
  var p = P(), d = D(), dis = closed ? ' disabled' : '', h = '<div class="card">';
  h += '<div class="top"><div><span class="pill">Poll ' + (S.current + 1) + ' of ' + POLLS.length + '</span><span class="pill alt">' + TYPE[p.type] + '</span></div>' +
    '<div id="timer" class="timer' + (left <= 5 ? ' warn' : '') + '">⏱ ' + fmt(left) + '</div></div>';
  h += '<div class="ptitle">' + esc(p.title) + '</div><p class="q">' + esc(p.q) + '</p>';
  h += '<div class="mode"><button class="btn' + (S.mode === 'vote' ? '' : ' ghost') + '" onclick="setMode(\'vote\')">👆 Participant voting</button>' +
    '<button class="btn' + (S.mode === 'tally' ? '' : ' ghost') + '" onclick="setMode(\'tally\')">✋ Facilitator tally</button></div>';
  if (closed) h += '<div class="closed">⏹ Voting closed <button class="btn ghost" onclick="reopen()">Reopen voting</button></div>';

  if (S.mode === 'tally') {
    h += '<p class="muted">Count raised hands and enter the totals.</p>';
    p.options.forEach(function (o, i) { h += tallyRow(optLabel(p, i), i, d.counts[i], dis); });
    if (p.type === 'multi') h += tallyRow('People who answered (for %)', -1, d.voters, dis);
  } else {
    h += '<p class="muted">' + (p.type === 'multi' ? 'Select all that apply, then submit.' : 'Select one, then submit.') + '</p>';
    if (p.type === 'rating') {
      h += '<div class="scale">';
      p.options.forEach(function (o, i) { h += '<button class="opt' + (sel.indexOf(i) >= 0 ? ' sel' : '') + '" onclick="pick(' + i + ')"' + dis + '>' + o + '</button>'; });
      h += '</div><div class="labels"><span>1 = ' + esc(p.minLabel) + '</span><span>5 = ' + esc(p.maxLabel) + '</span></div>';
    } else {
      h += '<div class="opts">';
      p.options.forEach(function (o, i) {
        h += '<button class="opt' + (sel.indexOf(i) >= 0 ? ' sel' : '') + '" onclick="pick(' + i + ')"' + dis + '><span class="letter">' + L(i) + '</span><span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
    }
    h += '<p><button class="btn" onclick="submitVote()"' + dis + '>Submit vote</button> <span id="msg" class="muted"></span></p>';
  }
  h += '<p class="muted">Responses: <strong>' + d.voters + '</strong></p>';

  h += '<div class="controls">' +
    '<button class="btn ghost" onclick="go(-1)"' + (S.current === 0 ? ' disabled' : '') + '>◀ Prev</button>' +
    '<button class="btn" onclick="toggleTimer()"' + dis + '>' + (tid ? '⏸ Pause timer' : '▶ Start timer') + '</button>' +
    '<button class="btn ghost" onclick="resetTimer();render()">↺ Reset timer</button>' +
    '<button class="btn" onclick="toggleReveal()">' + (d.revealed ? 'Hide results' : '📊 Show results') + '</button>' +
    '<button class="btn ghost" onclick="notesOn=!notesOn;render()">' + (notesOn ? 'Hide notes' : '📝 Notes') + '</button>' +
    '<button class="btn danger" onclick="resetPoll()">Clear poll</button>' +
    '<button class="btn" onclick="go(1)">' + (S.current === POLLS.length - 1 ? 'Finish ▶' : 'Next ▶') + '</button></div>';

  if (d.revealed) h += '<div class="card" style="margin-top:16px">' + results(p, d) + '</div>';
  if (notesOn) h += '<div class="notes"><h3>📝 Facilitator notes</h3>' +
    '<p><strong>Purpose:</strong> ' + esc(p.notes.purpose) + '</p>' +
    '<p><strong>Listen for:</strong> ' + esc(p.notes.listen) + '</p>' +
    '<p><strong>Follow-up question:</strong> ' + esc(p.notes.follow) + '</p>' +
    '<p><strong>Act on it:</strong> ' + esc(p.notes.act) + '</p></div>';
  return h + '</div>';
}
function topLine(p, d) {
  var t = totalOf(p, d);
  if (!t) return 'No responses yet';
  if (p.type === 'rating') return 'Average ' + avgOf(d).toFixed(1) + ' / 5';
  var max = Math.max.apply(null, d.counts), names = [];
  p.options.forEach(function (o, i) { if (d.counts[i] === max) names.push(o); });
  return names.join(' / ') + ' (' + Math.round(max / t * 100) + '%)';
}
function summary() {
  var h = '<div class="card"><h2>Session summary – AMIG Advanced Tips</h2><p class="muted">' + new Date().toLocaleDateString() + '</p>' +
    '<table><tr><th>#</th><th>Poll</th><th>Type</th><th>Responses</th><th>Top result</th></tr>';
  POLLS.forEach(function (p, n) {
    var d = S.data[n];
    h += '<tr><td>' + (n + 1) + '</td><td>' + esc(p.title) + '</td><td>' + TYPE[p.type] + '</td><td>' + d.voters + '</td><td>' + esc(topLine(p, d)) + '</td></tr>';
  });
  h += '</table><h3>Session wrap-up</h3>' +
    '<p>Key themes: least-selected tools in Polls 2 and 3, and how many answer C or D in Polls 4 and 5.</p>' +
    '<p>Next step: start each section demo with its least-used tool.</p>' +
    '<p class="noprint"><button class="btn" onclick="exportCSV()">⬇ Export results (CSV)</button>' +
    '<button class="btn ghost" onclick="window.print()">🖨 Print / Save as PDF</button>' +
    '<button class="btn danger" onclick="resetAll()">Reset all votes</button>' +
    '<button class="btn ghost" onclick="showView(\'present\')">◀ Back to polls</button></p></div>';
  return h;
}
function exportCSV() {
  var rows = [['Poll #', 'Title', 'Type', 'Question', 'Option', 'Count', 'Percent or Average']];
  POLLS.forEach(function (p, n) {
    var d = S.data[n], total = totalOf(p, d);
    p.options.forEach(function (o, i) {
      rows.push([n + 1, p.title, TYPE[p.type], p.q, optLabel(p, i), d.counts[i], total ? Math.round(d.counts[i] / total * 100) + '%' : '0%']);
    });
    if (p.type === 'rating' && total) rows.push([n + 1, p.title, TYPE[p.type], p.q, 'Average rating (out of 5)', total, avgOf(d).toFixed(2)]);
  });
  var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'amig-poll-results.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function render() { document.getElementById('app').innerHTML = view === 'present' ? present() : summary(); }
function showView(v) {
  view = v;
  document.getElementById('tabPresent').className = v === 'present' ? 'on' : '';
  document.getElementById('tabSummary').className = v === 'summary' ? 'on' : '';
  render();
}
document.addEventListener('keydown', function (e) {
  if (view !== 'present') return;
  var k = e.key.toLowerCase();
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (k === 't') toggleTimer();
  else if (k === 'r') toggleReveal();
  else if (k === 'n') { notesOn = !notesOn; render(); }
});

/* ===== START ===== */
load();
resetTimer();
showView('present');
</script>
</body>
</html>
